name:               "crazyflie_quad"
# Crazyflie 2.1 — paramètres alignés sur test_cf/RL-real/cf_params.py
# (single source of truth de la pipeline Genesis/vrai vol).
mass:               0.027                          # [kg]

# Bras moteur X-config : empattement ~92 mm -> bras ~46 mm -> offset xy ~0.0325 m.
tbm_fr:             [ 0.0325, -0.0325, 0.0]        # [m]
tbm_bl:             [-0.0325,  0.0325, 0.0]        # [m]
tbm_br:             [-0.0325, -0.0325, 0.0]        # [m]
tbm_fl:             [ 0.0325,  0.0325, 0.0]        # [m]

inertia:            [1.4e-5, 1.4e-5, 2.2e-5]       # [kg·m^2]  Crazyflie 2.x

motor_omega_min:    150.0                          # [rad/s]
motor_omega_max:    2500.0                         # [rad/s]
motor_tau:          0.0245                         # [s]
motor_inertia:      2.0e-08                        # [kg·m^2]

# Borne de body-rate de la commande = OMEGA_MAX de cf_params (0.5 rad/s par axe).
omega_max:          [0.5, 0.5, 0.5]                # [rad/s]

# T = thrust_map[0]*omega^2 -> 0.15 N à omega=2500 rad/s (THRUST_MAX_PER_ROTOR).
thrust_map:         [2.4e-8, 0.0, 0.0]             # [N/(rad/s)^2, N/(rad/s), N]
kappa:              0.005                          # [Nm/N]
thrust_min:         0.0                            # [N]
thrust_max:         0.15                           # [N] par moteur (= THRUST_MAX_PER_ROTOR)
rotors_config:      "cross"

aero_coeff_1:       [0.0, 0.0, 0.0]
aero_coeff_3:       [0.0, 0.0, 0.0]
aero_coeff_h:        0.0
